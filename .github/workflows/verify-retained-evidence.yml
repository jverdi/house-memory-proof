name: Verify aggregate qualification evidence
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-retained-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: native-full
            artifact: 12117025728
            sha256: 5774ae88771d02cb87fcbaf107dbe29f6b53840410a2c7b7270efd13234f7bf1
            kind: native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify archive digest and extract only aggregate metrics
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          EVIDENCE_KIND: ${{ matrix.kind }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,re,subprocess,zipfile
          artifact=os.environ['ARTIFACT_ID'];assert artifact.isdecimal()
          raw=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+artifact+'/zip'],capture_output=True,check=True,timeout=90).stdout
          digest=hashlib.sha256(raw).hexdigest();assert digest==os.environ['EXPECTED_SHA256'], 'Artifact digest mismatch'
          archive=zipfile.ZipFile(io.BytesIO(raw))
          def read(name):
              info=archive.getinfo(name);assert info.file_size<=4000000
              return json.loads(archive.read(info))
          def select(data,keys):
              return {key:data[key] for key in keys if key in data}
          metric_keys=['passed','positiveAccepted','positiveQueries','falseAccepts','negativeQueries','worstAcceptedPositionErrorMetres','p95Metres','availability','oracleReadDenied']
          out=dict(artifact=int(artifact),artifactSHA256=digest,artifactDigestVerified=True,kind=os.environ['EVIDENCE_KIND'],productionQualified=False)
          if out['kind']=='fixtures':
              out['fixtures']={}
              for name in ['rough-a','rough-b','paired','staggered']:
                  data=read(name+'.json');value=select(data,metric_keys);value['scenarioMetrics']={}
                  for scenario in ['nominal selected room','finished stage with retained reference surfaces']:
                      if scenario in data.get('scenarioMetrics',{}):
                          value['scenarioMetrics'][scenario]=select(data['scenarioMetrics'][scenario],['attempts','accepted','availability','p95Metres','worstMetres','passed'])
                  out['fixtures'][name]=value
          elif out['kind']=='native':
              native=read('native-self-test.json')
              out.update(nativePassed=native['passed'],nativeTotal=len(native['tests']),nativePassedCount=sum(t['passed'] for t in native['tests']),nativeElapsedSeconds=native['elapsedSeconds'])
              out['processRecovery']={mode:read('process-recovery-'+mode+'.json')['passed'] for mode in ['journal','capture-row','migration']}
              portable=read('portable-tests.json');out['portable']=dict(passed=portable['passed'],cases=len(portable['cases']))
              out['independentReaders']={}
              for name in ['test','textured','points','house-surface']:
                  data=read(name+'-gltf-validation.json');out['independentReaders'][name+'-gltf']=dict(errors=data['issues']['numErrors'],warnings=data['issues']['numWarnings'])
              for name in ['test-usd','textured-usd','points-usd','archive','mesh-interchange','offline-viewer','semantic-csv']:
                  out['independentReaders'][name]=dict(passed=read(name+'-validation.json')['passed'])
              log=archive.read('ui-tests.log').decode('utf-8')
              out['uiPassed']={}
              for name in ['testLandscapeControlsAndRotation','testPersonalHouseWorkflow','testPhotoPointWorkflow']:
                  pattern=r"Test Case '-\[HouseXrayUITests\.HouseXraySmoke "+name+r"\]' passed \(([0-9.]+) seconds\)"
                  match=re.search(pattern,log)
                  out['uiPassed'][name]=dict(passed=bool(match),seconds=float(match.group(1)) if match else None)
          elif out['kind']=='stress':
              data=read('summary.json')
              keys=['cases','positiveQueries','positiveAccepted','availability','unrelatedNegativeQueries','repeatedRoomAndFloorChallenges','criticalChallenges','executedUnrelatedQueries','criticalFalseAccepts','oracleControlFailures','p50Metres','p95Metres','worstMetres','spatialTargetsPassed','passed']
              out.update(select(data,keys))
              out['development']=select(data['development'],keys);out['protected']=select(data['protected'],keys)
          else:raise ValueError('Unknown evidence kind')
          # Only explicit aggregate fields leave the job: no matrices, observations,
          # image names, feature IDs, case seeds, or raw report bodies.
          print('AGGREGATE_EVIDENCE '+json.dumps(out,allow_nan=False),flush=True)
          PY
