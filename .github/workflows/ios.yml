name: Build and deliver House Proof

on:
  push:
    branches: [main, continuation-evidence-20261017]
    paths:
      - HouseMemoryProof/**
      - HouseXrayUITests/**
      - HouseMemoryProof.xcodeproj/**
      - ci/simulator.sh
      - ci/run_bounded.py
      - ci/testflight.sh
      - packages/**
      - tooling/**
      - .github/workflows/ios.yml
  workflow_dispatch:
    inputs:
      ship:
        description: Upload the accepted personal-beta tag after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: house-proof-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, '[release]') && github.sha || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, '[release]') }}

jobs:
  simulator:
    name: Compile and launch on iPhone simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: build/opencv
          key: opencv-4.13.0-ios26-arm64-v1-${{ hashFiles('tooling/opencv/build.sh') }}
      - uses: actions/cache@v4
        with:
          path: build/apriltag
          key: apriltag-3.4.5-apple-arm64-v1-${{ hashFiles('tooling/references/build.sh') }}
      - uses: actions/cache@v4
        with:
          path: build/ceres
          key: ceres-2.2.0-eigen3.4-arm64-v2-${{ hashFiles('tooling/solver/build.sh') }}
          restore-keys: |
            ceres-2.2.0-eigen3.4-arm64-v3
            ceres-2.2.0-eigen3.4-arm64-v1
            ceres-host-bootstrap-v1
      - name: Prepare fixtures and cached native dependencies
        timeout-minutes: 30
        run: bash ci/simulator.sh prepare
      - name: Compile iOS source
        id: compile
        timeout-minutes: 12
        run: bash ci/simulator.sh compile
      - name: Compile distribution configuration without signing
        timeout-minutes: 12
        run: bash ci/simulator.sh release
      - name: Start iPhone simulator
        timeout-minutes: 6
        run: bash ci/simulator.sh boot
      - name: Run native image, reconstruction, storage and movie diagnostics
        id: native
        timeout-minutes: 10
        run: bash ci/simulator.sh native
      - name: Preserve native checkpoint before interface and interoperability checks
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: native-checkpoint-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/evidence/native-self-test.json
            build/evidence/native-progress.json
            build/evidence/self-test-partial.json
            build/evidence/native-reader-status.json
            build/evidence/native-coverage-guidance.json
            build/evidence/native-tour-framing.json
            build/evidence/native-tour-reveal.json
            build/evidence/tour-reveal-validation.json
            build/evidence/native-ifc-geometry.json
            build/evidence/native-service-tour.json
            build/evidence/native-boundary-source.json
            build/evidence/native-compatibility.json
            build/evidence/capture-runtime-validation.json
            build/evidence/native-drawing-benchmark.json
            build/evidence/drawing-benchmark-validation.json
            build/evidence/native-navigation-benchmark.json
            build/evidence/navigation-benchmark-validation.json
            build/evidence/native-reconstructed-navigation.json
            build/evidence/reconstructed-navigation-validation.json
            build/evidence/service-tour-validation.json
            build/evidence/command-tests.json
            build/evidence/cli-command-validation.json
            build/evidence/cli-reconstruction-validation.json
            build/evidence/ifc-source-validation.json
            build/evidence/ifc-properties-validation.json
            build/evidence/drawing-marks-validation.json
            build/evidence/service-envelope-validation.json
            build/evidence/portable-package-validation.json
            build/evidence/coded-reference-diagnostics.json
            build/evidence/coded-source-*.png
            build/evidence/metal-target.png
            build/evidence/incomplete-native-sample.txt
            build/evidence/HouseMemoryProof*.ips
          if-no-files-found: warn
          retention-days: 14
      - name: Verify recovery across actual process termination
        if: always() && !cancelled() && steps.compile.outcome == 'success' && hashFiles('build/evidence/simulator-result.json') != ''
        timeout-minutes: 6
        run: bash ci/simulator.sh recovery
      - name: Exercise the iPhone interface workflows
        if: always() && !cancelled() && steps.compile.outcome == 'success' && hashFiles('build/evidence/simulator-result.json') != ''
        timeout-minutes: 32
        run: bash ci/simulator.sh ui
      - name: Verify portable core and independent export readers
        if: always() && !cancelled() && steps.compile.outcome == 'success' && hashFiles('build/evidence/test.glb') != ''
        timeout-minutes: 10
        run: |
          python3 tooling/hm test
          python3 tooling/check_semantic_csv.py
          python3 tooling/check_chunked_snapshot.py
          npm install --prefix build/validation --ignore-scripts gltf-validator@2.0.0-dev.3.10 playwright@1.56.1
          node tooling/check_exports.cjs
          python3 -c "import zipfile; z=zipfile.ZipFile('build/evidence/test.hxray'); open('build/evidence/offline-viewer.html','wb').write(z.read('viewer.html'))"
          build/validation/node_modules/.bin/playwright install chromium
          node tooling/check_viewer.cjs
          python3 -m venv build/usd-env
          build/usd-env/bin/pip install usd-core==25.11 numpy==2.3.5 trimesh==5.1.1
          build/usd-env/bin/python tooling/check_usd.py
          build/usd-env/bin/python tooling/check_mesh_interchange.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/evidence/
          if-no-files-found: error
          retention-days: 14

  testflight:
    name: Archive and upload to Apple
    needs: simulator
    concurrency:
      group: personal-apple-upload
      cancel-in-progress: false
    # One owner-requested snapshot; subsequent implementation commits do not upload.
    if: (github.event_name == 'push' && github.event.head_commit.message == '[release] Ship current-state TestFlight simulator-start-20261018') || (github.event_name == 'workflow_dispatch' && inputs.ship && github.ref == 'refs/tags/personal-beta')
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: build/opencv
          key: opencv-4.13.0-ios26-arm64-v1-${{ hashFiles('tooling/opencv/build.sh') }}
      - uses: actions/cache@v4
        with:
          path: build/apriltag
          key: apriltag-3.4.5-apple-arm64-v1-${{ hashFiles('tooling/references/build.sh') }}
      - uses: actions/cache@v4
        with:
          path: build/ceres
          key: ceres-2.2.0-eigen3.4-arm64-v2-${{ hashFiles('tooling/solver/build.sh') }}
          restore-keys: |
            ceres-2.2.0-eigen3.4-arm64-v3
            ceres-2.2.0-eigen3.4-arm64-v1
            ceres-host-bootstrap-v1
      - name: Sign and upload for internal TestFlight testing
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '4RLZ6F3UA4' }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.jverdi.housememoryproof' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: bash ci/testflight.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upload-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 90

