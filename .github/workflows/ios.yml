name: Build and deliver House Proof

on:
  push:
    branches: [main]
    paths:
      - HouseMemoryProof/**
      - HouseMemoryProof.xcodeproj/**
      - ci/simulator.sh
      - ci/testflight.sh
      - packages/**
      - tooling/**
      - .github/workflows/ios.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: house-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator:
    name: Compile and launch on iPhone simulator
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile, launch, and capture evidence
        run: bash ci/simulator.sh
      - name: Verify portable core and independent export readers
        run: |
          python3 tooling/hm test
          npm install --prefix build/validation --ignore-scripts gltf-validator@2.0.0-dev.3.10
          node tooling/check_exports.cjs
          python3 -m venv build/usd-env
          build/usd-env/bin/pip install usd-core==25.11
          build/usd-env/bin/python tooling/check_usd.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/evidence/
          if-no-files-found: error
          retention-days: 14

  testflight:
    name: Archive and upload to Apple
    needs: simulator
    if: false # Release held during implementation; enable once for final candidate.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sign and upload for internal TestFlight testing
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '4RLZ6F3UA4' }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.jverdi.housememoryproof' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: bash ci/testflight.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upload-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 14
