name: Verify bounded Ceres solver packaging
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/solver.yml
      - tooling/solver/**
      - packages/visual-core/hx_bundle*
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solver-packaging
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/ceres
          key: ceres-2.2.0-eigen3.4-arm64-v3
          restore-keys: ceres-host-bootstrap-v1
      - run: bash tooling/solver/build.sh host
      - uses: actions/cache/save@v4
        if: always() && hashFiles('build/ceres/host/lib/libceres.a') != ''
        with:
          path: build/ceres
          key: ceres-host-bootstrap-v1
      - name: Compile and run exact solver diagnostics
        run: |
          mkdir -p build/solver-evidence
          clang++ -std=c++17 -O2 -DEIGEN_MPL2_ONLY -DHX_BUNDLE_TEST_MAIN \
            -I build/ceres/host/include packages/visual-core/hx_bundle.cpp \
            build/ceres/host/lib/libceres.a -o build/bundle-test
          build/bundle-test | tee build/solver-evidence/report.json
      - run: bash tooling/solver/build.sh ios
      - run: du -k build/ceres/iphoneos/lib/libceres.a build/ceres/iphonesimulator/lib/libceres.a > build/solver-evidence/sizes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solver-packaging-evidence
          path: build/solver-evidence/
          retention-days: 30
