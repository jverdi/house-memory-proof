name: Audit finished-stage image correspondence residuals
on:
  push:
    branches: [main]
    paths: [.github/workflows/correspondence-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: correspondence-audit
  cancel-in-progress: true
jobs:
  replay:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ffa44947575049a8e3f13226f06133b5c7728094
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: build/opencv-host
          key: opencv-4.13.0-macos14-arm64-v1-sdk
      - uses: actions/cache@v4
        with:
          path: build/apriltag
          key: apriltag-3.4.5-apple-arm64-v1-${{ hashFiles('tooling/references/build.sh') }}
      - uses: actions/cache@v4
        with:
          path: build/ceres
          key: ceres-2.2.0-macos-arm64-v1
      - name: Record isolated candidate diff and build exact adapter
        run: |
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('packages/visual-core/hx_vision.cpp')
          s=p.read_text()
          before='double scale=std::min(1.0,1280.0/std::max(w,h));cv::resize(source,image,cv::Size(),scale,scale,cv::INTER_AREA);'
          after='double scale=1280.0/std::max(w,h);cv::resize(source,image,cv::Size(),scale,scale,scale>1 ? cv::INTER_LINEAR:cv::INTER_AREA);'
          assert s.count(before)==1
          s=s.replace(before,after)
          before='xy[n*2]=keys[i].pt.x/image.cols;xy[n*2+1]=keys[i].pt.y/image.rows;'
          after='xy[n*2]=(keys[i].pt.x+.5)/image.cols-.5/w;xy[n*2+1]=(keys[i].pt.y+.5)/image.rows-.5/h;'
          assert s.count(before)==1
          s=s.replace(before,after)
          p.write_text(s)
          p=pathlib.Path('HouseMemoryProof/VisualMapping.swift')
          s=p.read_text()
          before='    guard xy.count>=60 else{diagnostic?("Insufficient repeated features for multi-view query refinement");return nil}'
          assert s.count(before)==1
          after=before+'\n    if xy.count<=600,let bytes=try? JSONSerialization.data(withJSONObject:["xyz":xyz,"xy":xy],options:[.sortedKeys]),let payload=String(data:bytes,encoding:.utf8){diagnostic?("CorrespondencesJSON: "+payload)}'
          p.write_text(s.replace(before,after))
          PY
          mkdir -p build/vision-evaluation
          git diff -- packages/visual-core/hx_vision.cpp HouseMemoryProof/VisualMapping.swift > build/vision-evaluation/candidate.diff
          bash tooling/opencv/build-host.sh
          python3 -m venv build/vision-env
          build/vision-env/bin/pip install numpy==2.3.5 pillow==11.3.0
      - name: Preserve all four unchanged house diagnostics
        run: |
          failed=0
          for spec in 'rough-a 905771' 'rough-b 683431' 'paired 905771 --paired' 'staggered 905771 --paired --staggered'; do
            read -r name seed arg1 arg2 <<< "$spec"
            if build/vision-env/bin/python tooling/simulation/house_layout_fixture.py "build/$name" --seed "$seed" ${arg1:-} ${arg2:-}; then
              python3 ci/run_bounded.py 600 build/vision-env/bin/python tooling/simulation/replay_fixture.py --executable build/vision-replay --fixture "build/$name" --output "build/vision-evaluation/$name.json" --refine --bundle --house || failed=1
            else
              failed=1
            fi
          done
          # Candidate output is sealed before the evaluator's camera truth is
          # retained for this development-only residual diagnosis.
          python3 - <<'PYTRUTH'
          import pathlib,json
          for name in ['rough-a','rough-b','paired','staggered']:
              p=pathlib.Path('build')/name/'vision-queries.json'
              if p.exists():
                  original=json.loads(p.read_text())
                  out=pathlib.Path('build/vision-evaluation')/(name+'-evaluator-cameras.json')
                  out.write_text(json.dumps({'syntheticOnly':True,'queries':original['queries']},indent=2))
          PYTRUTH
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correspondence-audit
          path: build/vision-evaluation/
          retention-days: 14


