name: Rebuild pinned reference simulation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3bb06ee5deabe9b1dcc8b84cd4e572b766c00134
      - uses: actions/cache@v4
        with:
          path: build/blender
          key: blender-4.5.3-linux-x64
      - run: bash tooling/blender/install.sh
      - run: build/blender/blender --background --python tooling/blender/house.py -- build/rendered-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-reference-fixture
          path: build/rendered-fixture/
          retention-days: 30
