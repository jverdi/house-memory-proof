name: Diagnose bounded subpixel feature refinement
on:
  push:
    branches: [main]
    paths: [.github/workflows/feature-subpixel.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feature-subpixel
  cancel-in-progress: true
jobs:
  replay:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ffa44947575049a8e3f13226f06133b5c7728094
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: build/opencv-host
          key: opencv-4.13.0-macos14-arm64-v1-sdk
      - uses: actions/cache@v4
        with:
          path: build/apriltag
          key: apriltag-3.4.5-apple-arm64-v1-${{ hashFiles('tooling/references/build.sh') }}
      - uses: actions/cache@v4
        with:
          path: build/ceres
          key: ceres-2.2.0-macos-arm64-v1
      - name: Record isolated candidate diff and build exact adapter
        run: |
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('packages/visual-core/hx_vision.cpp')
          s=p.read_text()
          before='double scale=std::min(1.0,1280.0/std::max(w,h));cv::resize(source,image,cv::Size(),scale,scale,cv::INTER_AREA);'
          after='double scale=1280.0/std::max(w,h);cv::resize(source,image,cv::Size(),scale,scale,scale>1 ? cv::INTER_LINEAR:cv::INTER_AREA);'
          assert s.count(before)==1
          s=s.replace(before,after)
          before='xy[n*2]=keys[i].pt.x/image.cols;xy[n*2+1]=keys[i].pt.y/image.rows;'
          after='xy[n*2]=(keys[i].pt.x+.5)/image.cols-.5/w;xy[n*2+1]=(keys[i].pt.y+.5)/image.rows-.5/h;'
          assert s.count(before)==1
          s=s.replace(before,after)
          before=' std::set<std::array<uint8_t,32>> unique;'
          after=""" // Diagnostic only: refine coordinates on the same analysed pixels.
           // Retain the scale-space location if refinement moves more than
           // two analysis pixels, is nonfinite, or leaves the image.
           std::vector<cv::Point2f> refined;for(const auto& key:keys)refined.push_back(key.pt);
           cv::cornerSubPix(image,refined,cv::Size(5,5),cv::Size(-1,-1),cv::TermCriteria(cv::TermCriteria::COUNT|cv::TermCriteria::EPS,20,0.001));
           for(size_t i=0;i<keys.size();i++){auto p=refined[i];if(std::isfinite(p.x)&&std::isfinite(p.y)&&p.x>=0&&p.y>=0&&p.x<image.cols&&p.y<image.rows&&cv::norm(p-keys[i].pt)<=2.0)keys[i].pt=p;}
           std::set<std::array<uint8_t,32>> unique;"""
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          PY
          mkdir -p build/vision-evaluation
          git diff -- packages/visual-core/hx_vision.cpp > build/vision-evaluation/candidate.diff
          bash tooling/opencv/build-host.sh
          python3 -m venv build/vision-env
          build/vision-env/bin/pip install numpy==2.3.5 pillow==11.3.0
      - name: Preserve all four unchanged house diagnostics
        run: |
          failed=0
          for spec in 'rough-a 905771' 'rough-b 683431' 'paired 905771 --paired' 'staggered 905771 --paired --staggered'; do
            read -r name seed arg1 arg2 <<< "$spec"
            if build/vision-env/bin/python tooling/simulation/house_layout_fixture.py "build/$name" --seed "$seed" ${arg1:-} ${arg2:-}; then
              python3 ci/run_bounded.py 600 build/vision-env/bin/python tooling/simulation/replay_fixture.py --executable build/vision-replay --fixture "build/$name" --output "build/vision-evaluation/$name.json" --refine --bundle --house || failed=1
            else
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-subpixel
          path: build/vision-evaluation/
          retention-days: 14

