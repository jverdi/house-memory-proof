name: Evaluate native visual localization
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vision-evaluation.yml
      - tooling/opencv/build-host.sh
      - tooling/solver/**
      - tooling/simulation/VisionReplay.swift
      - tooling/simulation/replay_fixture.py
      - tooling/simulation/vision_matrix.py
      - tooling/simulation/vision_fixture.py
      - tooling/simulation/test_render_contract.py
      - tooling/simulation/house.py
      - tooling/simulation/house_layout_fixture.py
      - packages/visual-core/**
      - HouseMemoryProof/VisualMapping.swift
      - HouseMemoryProof/EvidenceModels.swift
      - HouseMemoryProof/Domain.swift
      - HouseMemoryProof/PoseRefinement.swift
      - HouseMemoryProof/PoseGraph.swift
      - HouseMemoryProof/ReferenceRegistration.swift
      - HouseMemoryProof/BundleRefinement.swift
      - HouseMemoryProof/PhotoReconstruction.swift
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-evaluation
  cancel-in-progress: true
jobs:
  replay:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: build/opencv-host
          key: opencv-4.13.0-macos14-arm64-v1-sdk
          restore-keys: opencv-4.13.0-macos14-arm64-v1-
      - uses: actions/cache@v4
        with:
          path: build/ceres
          key: ceres-2.2.0-macos-arm64-v1
          restore-keys: |
            ceres-2.2.0-eigen3.4-arm64-v3
            ceres-host-bootstrap-v1
      - name: Build shared production core as isolated command-line candidate
        id: candidate
        run: bash tooling/opencv/build-host.sh
      - name: Preserve compiled SDK even if candidate qualification fails
        if: always() && hashFiles('build/opencv-host/opencv2.framework/opencv2') != ''
        uses: actions/cache/save@v4
        with:
          path: build/opencv-host
          key: opencv-4.13.0-macos14-arm64-v1-sdk
      - name: Generate independent query views and enforce oracle exclusion
        run: |
          python3 -m venv build/vision-env
          build/vision-env/bin/pip install numpy==2.3.5 pillow==11.3.0
          build/vision-env/bin/python tooling/simulation/test_render_contract.py
          build/vision-env/bin/python tooling/simulation/vision_fixture.py build/vision-fixture
          build/vision-env/bin/python tooling/simulation/replay_fixture.py --executable build/vision-replay --fixture build/vision-fixture --output build/vision-evaluation/replay.json
      - name: Evaluate joint optimization against independent query views
        run: build/vision-env/bin/python tooling/simulation/replay_fixture.py --executable build/vision-replay --fixture build/vision-fixture --output build/vision-evaluation/bundle-replay.json --refine --bundle
      - name: Exercise a longer overlapping capture session
        run: |
          build/vision-env/bin/python tooling/simulation/vision_fixture.py build/vision-long --frames 36 --drift .03
          build/vision-env/bin/python tooling/simulation/replay_fixture.py --executable build/vision-replay --fixture build/vision-long --output build/vision-evaluation/long-session.json --refine --bundle
      - name: Exercise additional development room geometries
        run: build/vision-env/bin/python tooling/simulation/vision_matrix.py --executable build/vision-replay --output build/vision-evaluation/diversity
      - name: Exercise separate room and floor map identities
        timeout-minutes: 25
        run: |
          failed=0
          for seed in 905771 683431; do
            if python3 ci/run_bounded.py 300 build/vision-env/bin/python tooling/simulation/house_layout_fixture.py "build/house-layout-$seed" --seed "$seed"; then
              python3 ci/run_bounded.py 660 build/vision-env/bin/python tooling/simulation/replay_fixture.py --executable build/vision-replay --fixture "build/house-layout-$seed" --output "build/vision-evaluation/house-layout-$seed.json" --refine --bundle --house || failed=1
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Exercise closing walls with retained references and rejection challenges
        if: always() && !cancelled() && steps.candidate.outcome == 'success'
        timeout-minutes: 15
        run: |
          python3 ci/run_bounded.py 300 build/vision-env/bin/python tooling/simulation/house_layout_fixture.py build/house-paired --seed 905771 --paired
          python3 ci/run_bounded.py 660 build/vision-env/bin/python tooling/simulation/replay_fixture.py --executable build/vision-replay --fixture build/house-paired --output build/vision-evaluation/house-paired.json --refine --bundle --house
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-localization-evidence
          path: build/vision-evaluation/
          retention-days: 30
