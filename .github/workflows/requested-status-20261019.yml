name: Verify requested snapshot 234.1
on:
  push:
    branches: [main]
    paths: [.github/workflows/requested-status-20261019.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact-build owner delivery gate
        run: python3 -m unittest discover -s ci -p test_testflight_readiness.py
      - name: Verify requested 234.1 processing and owner access
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          APP_BUNDLE_ID: com.jverdi.housememoryproof
          TARGET_BUILD: '234.1'
          WAIT_SECONDS: '600'
        run: python3 ci/testflight_status.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requested-testflight-readiness-234-1
          path: build/evidence/testflight-status.json
          retention-days: 14
