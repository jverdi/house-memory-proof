name: Replay frozen rendered construction
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rendered-replay.yml
      - HouseMemoryProof/VisualMapping.swift
      - HouseMemoryProof/PoseGraph.swift
      - HouseMemoryProof/PhotoReconstruction.swift
      - packages/visual-core/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-rendered-replay
  cancel-in-progress: true
jobs:
  replay:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned durable fixture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p build/render-input
          if ! gh release download rendered-reference-v1 --pattern rendered-reference-v1.zip --dir build; then
            gh api "repos/$GH_REPO/actions/artifacts/12092369790/zip" > build/rendered-reference-v1.zip
          fi
          echo '91ad7166dcd79270aff71de974bd9dc2e3a9204f701ff8d7cd2313671b178d0b  build/rendered-reference-v1.zip' | shasum -a 256 --check
          unzip -q build/rendered-reference-v1.zip -d build/render-input
      - uses: actions/cache@v4
        with:
          path: build/opencv-host
          key: opencv-4.13.0-macos14-arm64-v1-sdk
          restore-keys: opencv-4.13.0-macos14-arm64-v1-
      - uses: actions/cache@v4
        with:
          path: build/ceres
          key: ceres-2.2.0-macos-arm64-v1
      - run: bash tooling/opencv/build-host.sh
      - name: Evaluate unchanged reference-target rendering
        run: python3 tooling/simulation/replay_fixture.py --executable build/vision-replay --fixture build/render-input/rendered-fixture --output build/vision-evaluation/rendered.json --refine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-rendered-replay-evidence
          path: build/vision-evaluation/
          retention-days: 30
