name: Qualify observed finished visual maps
on:
  push:
    branches: [main]
    paths: [.github/workflows/finished-map-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finished-map-qualification
  cancel-in-progress: true
jobs:
  replay:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: build/opencv-host
          key: opencv-4.13.0-macos14-arm64-v1-sdk
      - uses: actions/cache@v4
        with:
          path: build/apriltag
          key: apriltag-3.4.5-apple-arm64-v1-${{ hashFiles('tooling/references/build.sh') }}
      - uses: actions/cache@v4
        with:
          path: build/ceres
          key: ceres-2.2.0-macos-arm64-v1
      - name: Compile the unchanged runtime and check the renderer contract
        run: |
          bash tooling/opencv/build-host.sh
          python3 -m venv build/vision-env
          build/vision-env/bin/pip install numpy==2.3.5 pillow==11.3.0
          build/vision-env/bin/python -m unittest discover -s tooling/simulation -p test_render_contract.py
          mkdir -p build/finished-map-evidence
          git rev-parse HEAD > build/finished-map-evidence/source.txt
          shasum -a 256 build/vision-replay > build/finished-map-evidence/binary.txt
      - name: Replay finished captures with unchanged query and ambiguity gates
        run: |
          failed=0
          for seed in 905771 683431; do
            build/vision-env/bin/python tooling/simulation/house_layout_fixture.py "build/finished-$seed" --seed "$seed" --paired --staggered --finished-capture
            build/vision-env/bin/python tooling/simulation/replay_fixture.py --executable build/vision-replay --fixture "build/finished-$seed" --output "build/finished-map-evidence/$seed.json" --refine --bundle --house || failed=1
          done
          exit "$failed"
      - name: Print aggregate results only
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json,pathlib
          for path in sorted(pathlib.Path('build/finished-map-evidence').glob('*.json')):
              report=json.loads(path.read_text())
              keys=['passed','positiveQueries','positiveAccepted','negativeQueries','falseAccepts','p95Metres','worstAcceptedPositionErrorMetres','oracleReadDenied','scenarioMetrics','mapCount','optimizedCameraCount','maximumOptimizedCameraPositionErrorMetres']
              print('FINISHED_MAP_AGGREGATE '+json.dumps({k:report[k] for k in keys if k in report}),flush=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finished-map-diagnostics
          path: build/finished-map-evidence/
          retention-days: 14
