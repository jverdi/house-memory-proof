<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval'; connect-src hxlocal:;">
<script src="web-ifc-api-iife.js"></script><script src="coordinates.js"></script><script>
const send=x=>window.webkit.messageHandlers.ifc.postMessage(x);
(async()=>{try{
 send({type:'phase',phase:'initializing'});
 const api=new WebIFC.IfcAPI();api.SetWasmPath('hxlocal://bundle/');await api.Init();
 send({type:'phase',phase:'source'});
 const bytes=new Uint8Array(await (await fetch('hxlocal://input/model.ifc')).arrayBuffer());
 send({type:'phase',phase:'parsing'});
 const id=api.OpenModel(bytes,{COORDINATE_TO_ORIGIN:false});if(id<0)throw Error('IFC parsing failed');
 send({type:'phase',phase:'geometry'});
 const reference=IFCCoordinates.metadata(api,id,WebIFC),frame=IFCCoordinates.frame(reference);
 let total=0,totalIndices=0,parts=0;
 api.StreamAllMeshes(id,mesh=>{
  const line=api.GetLine(id,mesh.expressID,false);let name=line?.Name?.value||('IFC element '+mesh.expressID),guid=line?.GlobalId?.value||'';
  for(let j=0;j<mesh.geometries.size();j++){
   const placed=mesh.geometries.get(j),g=api.GetGeometry(id,placed.geometryExpressID);
   const v=api.GetVertexArray(g.GetVertexData(),g.GetVertexDataSize()),indices=api.GetIndexArray(g.GetIndexData(),g.GetIndexDataSize()),m=placed.flatTransformation;
   total+=v.length/6;totalIndices+=indices.length;if(total>200000||totalIndices>1200000)throw Error('IFC exceeds the total geometry admission limit');
   let vertices=[];for(let k=0;k<v.length;k+=6){let x=v[k],y=v[k+1],z=v[k+2];vertices.push(frame.point([m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14]]))}
   send({type:'mesh',name,guid,vertices,indices:Array.from(indices)});g.delete();parts++;
  }
 });api.CloseModel(id);send({type:'done',parts,vertices:total,indices:totalIndices,version:api.GetVersion(),coordinateReference:reference});
}catch(e){send({type:'error',message:String(e.message||e)})}})();
</script>
