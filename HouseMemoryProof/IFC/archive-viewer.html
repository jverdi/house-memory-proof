<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House Xray · offline 3D</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b131c;color:#edf4f6;font:15px system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:0;left:0;right:0;padding:16px;background:linear-gradient(#101c29,transparent);pointer-events:none}h1{font-size:22px;margin:0 0 8px}select,button,a{font:inherit;color:#eff;background:#203344;border:1px solid #506576;border-radius:8px;padding:9px;pointer-events:auto}label{display:inline-block;margin:3px}small{display:block;margin-top:8px;max-width:720px;line-height:1.4}#controls{position:absolute;bottom:20px;left:20px;display:grid;grid-template-columns:repeat(3,48px);gap:5px}#controls button{height:44px;touch-action:none}#status{position:absolute;bottom:18px;right:18px;max-width:45%;background:#0b131cbb;padding:8px;border-radius:6px;font-size:12px}#error{padding:24px;color:#ffb0a0}a{display:inline-block;text-decoration:none}@media(max-width:600px){h1{font-size:19px}header{padding:10px}small{font-size:11px}select{max-width:145px;padding:6px}}</style>
<canvas id="view" aria-label="Interactive house model"></canvas><header><h1 id="title">House Xray · offline 3D</h1><label>Stage <select id="stage"><option value="">All captured stages</option></select></label><label>System <select id="trade"><option value="">All systems</option></select></label><label><input id="ceilings" type="checkbox"> Ceilings</label> <button id="reset">Reset view</button> <a href="index.html">Photos</a><small>Approximate historical geometry · free-fly display, no collision or measurement certification. Drag to look; use WASD / arrow keys or the buttons to move. Q/E moves vertically. Original evidence remains in house.json and assets.</small></header><div id="controls"><span></span><button data-key="w" aria-label="Move forward">↑</button><span></span><button data-key="a" aria-label="Move left">←</button><button data-key="s" aria-label="Move backward">↓</button><button data-key="d" aria-label="Move right">→</button><button data-key="q" aria-label="Move down">−</button><span></span><button data-key="e" aria-label="Move up">+</button></div><div id="status"></div><div id="error" hidden></div>
<script id="model" type="application/octet-stream">__HOUSE_MODEL__</script>
<script>
'use strict';
try {
const raw=atob(document.getElementById('model').textContent.trim()),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),data=JSON.parse(new TextDecoder().decode(bytes));
document.getElementById('title').textContent=data.name+' · offline 3D';
const canvas=document.getElementById('view'),gl=canvas.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL 2 is unavailable in this viewer. Original photos and project metadata are still accessible.');
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,`#version 300 es
in vec3 position;uniform mat4 matrix;out vec3 world;void main(){world=position;gl_Position=matrix*vec4(position,1.);gl_PointSize=3.;}`));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;in vec3 world;uniform vec3 color;uniform bool points;out vec4 result;void main(){vec3 n=cross(dFdx(world),dFdy(world));float light=points||length(n)<0.000001?1.:.48+.52*abs(dot(normalize(n),normalize(vec3(.3,.8,.5))));result=vec4(color*light,1.);}`));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const position=gl.getAttribLocation(program,'position'),matrix=gl.getUniformLocation(program,'matrix'),color=gl.getUniformLocation(program,'color'),points=gl.getUniformLocation(program,'points');
let low=[Infinity,Infinity,Infinity],high=[-Infinity,-Infinity,-Infinity];
const meshes=data.features.map(f=>{const vao=gl.createVertexArray();gl.bindVertexArray(vao);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(f.vertices),gl.STATIC_DRAW);gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,3,gl.FLOAT,false,0,0);for(let i=0;i<f.vertices.length;i++) {const j=i%3;low[j]=Math.min(low[j],f.vertices[i]);high[j]=Math.max(high[j],f.vertices[i])}let count=f.vertices.length/3;if(f.triangles.length){gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(f.triangles),gl.STATIC_DRAW);count=f.triangles.length}return {...f,vao,count}});
for(const [id,values] of [['stage',data.stages],['trade',data.trades]])for(const entry of values){const option=document.createElement('option');option.value=entry.id;option.textContent=entry.name;document.getElementById(id).appendChild(option)}
const keys=new Set();let yaw=0,pitch=0,eye=[0,1.6,4],last=0;
function reset(){if(meshes.length){const center=low.map((x,i)=>(x+high[i])/2),radius=Math.max(2,Math.hypot(...high.map((x,i)=>x-low[i]))*1.15*Math.max(1,innerHeight/innerWidth));eye=[center[0],center[1]+radius*.25,center[2]+radius];pitch=-Math.atan(.25);yaw=0}keys.clear()};reset();document.getElementById('reset').onclick=reset;
window.addEventListener('keydown',e=>{if(e.target.matches('select,input,button'))return;const k=({ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d'})[e.key]||e.key.toLowerCase();if('wasdqe'.includes(k)&&k.length===1){keys.add(k);e.preventDefault()}});window.addEventListener('keyup',()=>keys.clear());window.addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>keys.clear());
for(const button of document.querySelectorAll('[data-key]')){button.onpointerdown=e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys.add(button.dataset.key)};button.onpointerup=button.onpointercancel=button.onlostpointercapture=()=>keys.delete(button.dataset.key)}
let pointer=null;canvas.onpointerdown=e=>{pointer=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!pointer)return;yaw-=(e.clientX-pointer[0])*.004;pitch=Math.max(-1.45,Math.min(1.45,pitch-(e.clientY-pointer[1])*.004));pointer=[e.clientX,e.clientY]};canvas.onpointerup=canvas.onpointercancel=()=>pointer=null;
function multiply(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}
function frame(time){const dt=Math.min(.05,(time-last)/1000||0);last=time;const forward=[-Math.sin(yaw),0,-Math.cos(yaw)],right=[Math.cos(yaw),0,-Math.sin(yaw)];for(let i=0;i<3;i++)eye[i]+=dt*2*((keys.has('w')-keys.has('s'))*forward[i]+(keys.has('d')-keys.has('a'))*right[i]);eye[1]+=dt*2*(keys.has('e')-keys.has('q'));
const ratio=Math.min(devicePixelRatio||1,2),w=Math.floor(innerWidth*ratio),h=Math.floor(innerHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.enable(gl.DEPTH_TEST);gl.clearColor(.035,.055,.08,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),r=[cy,0,-sy],u=[sy*sp,cp,cy*sp],b=[sy*cp,-sp,cy*cp],dot=v=>-v.reduce((s,x,i)=>s+x*eye[i],0);const view=[r[0],u[0],b[0],0,r[1],u[1],b[1],0,r[2],u[2],b[2],0,dot(r),dot(u),dot(b),1];const f=1/Math.tan(Math.PI/6),near=.03,far=1000,projection=[f/(w/h),0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0];gl.uniformMatrix4fv(matrix,false,multiply(projection,view));
const stage=document.getElementById('stage').value,trade=document.getElementById('trade').value,ceilings=document.getElementById('ceilings').checked;let shown=0;for(const m of meshes){if(stage&&m.stage!==stage||trade&&m.trade!==trade||!ceilings&&m.trade==='Ceiling')continue;gl.bindVertexArray(m.vao);gl.uniform3fv(color,m.color);gl.uniform1i(points,m.triangles.length===0);if(m.triangles.length)gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_INT,0);else gl.drawArrays(m.line?gl.LINE_STRIP:gl.POINTS,0,m.count);shown++}document.getElementById('status').textContent=shown+' objects · '+data.frameLabel+(data.simplified?' · display simplified; originals preserved':'');window.houseXrayViewer={objects:meshes.length,lines:meshes.filter(m=>m.line).length,shown,rendered:true,simplified:data.simplified};requestAnimationFrame(frame)}requestAnimationFrame(frame);
}catch(error){document.getElementById('error').hidden=false;document.getElementById('error').textContent=error.message;document.getElementById('view').style.display='none';window.houseXrayError=error.message}
</script></html>
